[tool.poetry]
name = "vision-track"
version = "0.1.0"
description = "Real-time person detection, tracking, and counting system with Streamlit."
authors = ["Mahdi Kheirkhah <mahdikheirkhah060@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
streamlit = "^1.32.0"
ultralytics = "^8.4.48"
supervision = "^0.27.0.post2"
opencv-python = "^4.9.0"

# --- LIGHTWEIGHT LOCAL INFERENCE ---
# We use ONNX Runtime instead of massive GPU PyTorch!
onnxruntime = "^1.17.0"

black = "^26.3.1"
pytest = "^9.0.3"
loguru = "^0.7.3"
jupyter = "^1.1.1"
pycocotools = "^2.0.1"
numpy = ">=1.26.4" 

[build-system]